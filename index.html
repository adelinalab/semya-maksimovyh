<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Семья Максимовых</title><meta name="robots" content="noindex,nofollow"></head><body>
<title>Семья Максимовых</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Marck+Script&family=Montserrat:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/highmaps.js"></script>
<script>if(!window.Highcharts){window.Highcharts={maps:{}};window.__noHC=true;}</script>
<script src="https://cdn.jsdelivr.net/npm/@highcharts/map-collection@2.3.3/countries/ru/ru-all.js"></script>
<style>
/* Семейная книга: белые страницы, бордовый акцент, чёрно-белые фото, читаемые подписи в древе. */
:root{
  --paper:#ffffff; --cream:#f7f3ee; --ink:#1f1b1a; --text:#3d3735; --muted:#7d746e; --line:#e8e1d9;
  --red:#8c1c2a; --red-d:#6d1420; --red-l:#b8545e; --brown:#7a5640;
  --f-serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-script:"Marck Script","Segoe Script",cursive;
  --f-sans:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Lora",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.65}
.wrap{max-width:1200px;margin:0 auto;padding-inline:32px}
.wrap.wide{max-width:1420px}
.wrap.text{max-width:860px}
@media (max-width:640px){.wrap{padding-inline:16px}}
h1,h2,h3,h4{font-family:var(--f-serif);font-weight:500;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bw{filter:grayscale(1) contrast(1.02)}
.noph{display:grid;place-items:center;width:100%;height:100%;background:#eee8e1;color:#a89c91;font-family:var(--f-sans);font-weight:600;font-size:1.1em}
.kick{font-size:.72rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.heart{display:inline-block;width:26px;height:24px;color:var(--red);vertical-align:middle}
a.src{color:var(--red);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(140,28,42,.35)}
a.src::after{content:"↗";font-family:var(--f-sans);font-size:.7em;margin-left:2px;vertical-align:2px}
a.src:hover{text-decoration-color:var(--red)}
.gap{font-family:var(--f-sans);font-style:normal;font-size:.86em;color:var(--brown);background:#f3ebe3;border-bottom:1px dashed #c7ad97;padding:1px 6px;border-radius:2px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:2px;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.logo{font-family:var(--f-serif);font-size:1.3rem;color:var(--ink);margin-right:auto;white-space:nowrap;text-decoration:none;padding-right:20px}
.logo i{font-style:normal;color:var(--red)}
.top nav{display:flex}
.top nav a{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:9px 11px;white-space:nowrap;border-bottom:2px solid transparent}
.top nav a:hover{color:var(--ink)}
.top nav a[aria-current="page"]{color:var(--red);border-bottom-color:var(--red)}

.page[hidden]{display:none}

/* главная: обложка */
.cover{padding-block:56px 40px;background:var(--cream)}
.cv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:34px;align-items:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair figure{margin:0}
.pair .ph{aspect-ratio:3/4;overflow:hidden;background:#eee8e1}
.pair .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.pair figure:nth-child(2){margin-top:46px}
.pair.r figure:nth-child(1){margin-top:46px}.pair.r figure:nth-child(2){margin-top:0}
.pair figcaption{font-size:.78rem;font-weight:600;margin-top:8px;line-height:1.35}
.pair figcaption span{display:block;font-weight:400;color:var(--muted);font-size:.92em}
.pcap{grid-column:1/-1;text-align:center;font-family:var(--f-script);font-size:1.7rem;color:var(--red);margin-top:6px;line-height:1}
.cvt{text-align:center}
.cvt .s{font-family:var(--f-script);font-size:clamp(3rem,5.6vw,4.6rem);color:var(--red);line-height:.9;display:block}
.cvt h1{font-size:clamp(1.8rem,3.1vw,2.7rem);letter-spacing:.08em;text-transform:uppercase;font-weight:400;margin-top:6px}
.cvt p{font-family:var(--f-body);color:var(--text);margin:20px auto 0;max-width:22em;font-size:1.04rem}
.cvt .yrs{font-family:var(--f-serif);font-size:1.15rem;letter-spacing:.2em;margin-top:18px;color:var(--muted)}
@media (max-width:980px){.cv{grid-template-columns:1fr 1fr}.cvt{grid-column:1/-1;order:-1}}
@media (max-width:560px){.cv{grid-template-columns:1fr;gap:28px}.pair figure:nth-child(2),.pair.r figure:nth-child(1){margin-top:24px}}

.blk{padding-block:80px}
.bh{text-align:center;max-width:760px;margin:0 auto 40px}
.bh h2{font-size:clamp(2rem,4vw,3rem)}
.bh p{font-family:var(--f-body);color:var(--muted);margin-top:12px;font-size:1.04rem}

/* разделы на главной */
.go{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media (max-width:900px){.go{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.go{grid-template-columns:1fr}}
.gc{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center;text-decoration:none;background:#fff;border:1px solid var(--line);padding:14px;transition:border-color .2s,transform .2s}
.gc:hover{border-color:var(--red);transform:translateY(-2px)}
.gc .ph{width:96px;height:120px;overflow:hidden;background:#eee8e1}
.gc .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.gc .ph.ic{display:grid;place-items:center;background:var(--red);color:#fff}
.gc .ph.ic svg{width:40px;height:40px}
.gc b{display:block;font-family:var(--f-serif);font-weight:500;font-size:1.35rem;line-height:1.15}
.gc span{display:block;font-size:.84rem;color:var(--muted);margin-top:6px;line-height:1.45}

/* древо — читаемые подписи */
.tv{position:relative;overflow:hidden}
.tv.scroll{overflow:auto;cursor:grab}
.tv.drag{cursor:grabbing;user-select:none}
.sizer{position:relative;margin:0 auto}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.canvas svg{position:absolute;left:0;top:0;overflow:visible}
.canvas svg path{fill:none;stroke:#c2b4a7;stroke-width:1.4;stroke-linecap:round;transition:opacity .3s}
.canvas svg path.dash{stroke-dasharray:3 6}
.canvas svg path.dim{opacity:.12}
.cd{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center;background:none;border:0;padding:0;cursor:pointer;font:inherit;font-family:var(--f-sans);color:inherit;transform:translateX(-50%);transition:opacity .3s}
.cd .md{position:relative;display:block;border-radius:50%;overflow:hidden;background:#eee8e1;transition:transform .2s}
.cd .md img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.cd:hover .md{transform:scale(1.04)}
.cd.unk .md{background:transparent;border:1.4px dashed #c9b9ab}
.cd.unk .md i{display:grid;place-items:center;height:100%;font-style:normal;font-size:1.4em;font-weight:600;color:#bba99a}
.cd .t{margin-top:10px;line-height:1.25;width:100%}
.cd .sn{display:block;font-size:.72em;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cd .gn{display:block;font-size:1em;font-weight:600;line-height:1.2;margin-top:2px;color:var(--ink)}
.cd .mn{display:block;font-size:.8em;color:var(--muted)}
.cd .yr{display:block;font-size:.8em;font-weight:500;color:var(--text);margin-top:3px;font-variant-numeric:tabular-nums}
.cd .pl{display:block;font-size:.78em;color:var(--muted)}
.cd .rl{display:inline-block;font-size:.8em;font-weight:600;color:#fff;background:var(--red);padding:1px 8px;border-radius:20px;margin-top:5px;line-height:1.5}
.cd.unk .gn{color:var(--muted);font-weight:500}
.cd.dim{opacity:.12}
.famlab{position:absolute;display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;color:var(--red)}
.famlab::before,.famlab::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.famlab.om{color:var(--red)} .famlab.tl{color:var(--brown)}
.thint{text-align:center;font-size:.82rem;color:var(--muted);margin-top:14px}

/* шапка страницы */
.ph-h{background:var(--cream);padding-block:64px 54px;text-align:center}
.ph-h h1{font-size:clamp(2.4rem,5vw,3.8rem);margin-top:12px}
.ph-h .lead{font-family:var(--f-body);font-size:1.12rem;color:var(--text);max-width:40em;margin:18px auto 0;line-height:1.75}

/* главы истории */
.story{padding-block:70px 30px}
.ch{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:start;padding-block:46px;border-top:1px solid var(--line)}
.ch:first-child{border-top:0;padding-top:0}
.ch.rev{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.ch.rev .tx{order:2}
@media (max-width:900px){.ch,.ch.rev{grid-template-columns:1fr;gap:28px}.ch.rev .tx{order:0}}
.ch .no{font-family:var(--f-script);font-size:1.6rem;color:var(--red);line-height:1}
.ch h2{font-size:clamp(1.8rem,3vw,2.4rem);margin-top:6px}
.ch .body{margin-top:18px;font-family:var(--f-body);font-size:1.06rem;line-height:1.85;color:var(--text)}
.ch .body p+p{margin-top:14px}
.ch .who{font-family:var(--f-sans);font-size:.78em;font-weight:600;color:var(--red);white-space:nowrap}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal .slot:first-child{grid-column:1/-1;aspect-ratio:4/3}
.gal .slot{aspect-ratio:1}
.gal.one .slot{grid-column:1/-1;aspect-ratio:4/3}
.slot{position:relative;margin:0;background:var(--cream);overflow:hidden;display:flex;flex-direction:column}
.slot .img{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#bcae9f;min-height:0}
.slot .img svg{width:34px;height:34px}
.slot .img small{font-size:.6rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.slot .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot figcaption{font-size:.8rem;color:var(--text);padding:9px 2px 0;background:#fff;line-height:1.35}
.slot.has figcaption{color:var(--ink)}
.slot .up{display:none}
.editing .slot .up{display:flex;position:absolute;inset:auto 8px 8px 8px;gap:6px;justify-content:center;z-index:2}
.up button{font:inherit;font-size:.64rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:0;background:var(--ink);color:#fff;padding:8px 10px;cursor:pointer}
.up button.del{background:#fff;color:var(--ink);border:1px solid var(--line)}

/* древо линии */
.ltree{padding-block:60px 90px;background:var(--cream)}

/* война */
.war{padding-block:70px 90px}
.fates{display:grid;gap:30px}
.fate{display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;background:#fff;border:1px solid var(--line);padding:28px}
@media (max-width:720px){.fate{grid-template-columns:1fr;padding:20px;gap:20px}}
.fate .slot{aspect-ratio:3/4}
.badge{display:inline-block;font-size:.6rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:4px 10px;border:1px solid currentColor}
.badge.ok{color:var(--red)} .badge.q{color:var(--brown)}
.fate h3{font-size:1.9rem;margin-top:12px}
.fate .yy{font-size:.9rem;font-weight:600;color:var(--muted);margin-top:4px}
.fate dl{display:grid;grid-template-columns:auto minmax(0,1fr);margin:16px 0 0;font-size:.92rem}
.fate dt,.fate dd{padding:8px 0;border-top:1px solid var(--line)}
.fate dt{font-size:.62rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-right:18px;padding-top:10px}
.fate dd{margin:0}
.fate .body{margin-top:16px;font-family:var(--f-body);font-size:1.02rem;line-height:1.8;color:var(--text)}
.ctx{font-family:var(--f-body);font-size:1.06rem;line-height:1.85;color:var(--text);max-width:46em;margin:0 auto 44px;text-align:center}

/* география */
.geo{padding-block:60px 90px}
.poster{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);background:var(--cream)}
@media (max-width:960px){.poster{grid-template-columns:1fr}}
.gmap{height:600px;position:relative}
@media (max-width:640px){.gmap{height:420px}}
.gmap svg{display:block;width:100%;height:100%}
.leg{padding:34px 32px;display:grid;gap:22px;align-content:start;background:#fff;border:1px solid var(--line);margin:22px}
.leg h3{font-weight:400;font-size:1.7rem;letter-spacing:.12em;text-transform:uppercase;line-height:1.2}
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
@media (max-width:420px){.lg{grid-template-columns:1fr}}
.lg b{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.98rem}
.lg b i{width:11px;height:11px;border-radius:50%;flex:none}
.lg p{font-size:.8rem;color:var(--muted);margin-top:3px;padding-left:20px;line-height:1.45}
.lh{font-size:.62rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--red);border-bottom:1px solid var(--line);padding-bottom:8px}
.mlbl{font-family:var(--f-sans);font-size:12px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3.5px}

/* полное древо */
.full{padding-block:50px 80px;background:var(--cream)}
.vbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 16px;margin-bottom:20px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{font:inherit;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border:0;background:#fff;color:var(--ink);padding:12px 18px;cursor:pointer}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--red);color:#fff}
.ib{font:inherit;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;background:#fff;border:1px solid var(--line);color:var(--ink);padding:11px 14px;cursor:pointer}
.ib:hover{border-color:var(--red);color:var(--red)}
.stage{background:#fff}
#full:fullscreen{background:var(--cream);padding:16px;overflow:auto}

.next{display:flex;justify-content:space-between;gap:16px;padding-block:34px;border-top:1px solid var(--line)}
.next a{text-decoration:none;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.next a b{display:block;font-family:var(--f-serif);font-size:1.4rem;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink);margin-top:4px}
.next a:hover b{color:var(--red)}
.next a:last-child{text-align:right;margin-left:auto}

footer{background:var(--red);color:#fff;padding-block:46px;text-align:center}
footer .heart{color:#fff;width:34px;height:30px}
footer b{display:block;font-family:var(--f-serif);font-weight:400;font-size:1.6rem;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}

/* режим редактирования */
.edbar{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);box-shadow:0 14px 40px -18px rgba(40,20,20,.45);padding:8px}
.edbar[hidden]{display:none}
.edbar button{font:inherit;font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:10px 14px;cursor:pointer}
.edbar button.pri{background:var(--red);border-color:var(--red);color:#fff}
.edbar button[hidden]{display:none}
.edbar .st{font-size:.76rem;color:var(--muted);padding:0 6px;max-width:220px}
.editing [data-edit]{outline:1.5px dashed #c7ad97;outline-offset:6px;cursor:text}
.editing [data-edit]:focus{outline-color:var(--red)}

dialog{border:0;padding:0;width:min(880px,calc(100vw - 32px));background:#fff;color:var(--ink);box-shadow:0 40px 100px rgba(30,10,10,.35)}
dialog::backdrop{background:rgba(40,20,20,.55)}
.dl{display:grid;grid-template-columns:220px minmax(0,1fr)}
@media (max-width:560px){.dl{grid-template-columns:1fr}.dl .dph{aspect-ratio:4/3}}
.dl .dph{background:#eee8e1;position:relative;min-height:290px}
.dl .dph img,.dl .dph .noph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:grid}
.dl .db{padding:32px 34px 28px}
.dl .rlb{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--red);padding:3px 10px;border-radius:20px}
.dl h3{font-size:2rem;margin-top:12px}
.dl .maid{font-family:var(--f-body);font-style:italic;color:var(--muted);margin-top:2px}
.dl .dy{font-size:.76rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-top:12px}
.dl .dn{font-family:var(--f-body);font-size:.98rem;margin-top:14px;color:var(--text);line-height:1.75}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.2rem;cursor:pointer;z-index:2}
.mt{border-top:1px solid var(--line);padding:24px 0 28px;background:var(--cream)}
.mt-h{font-size:.66rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);text-align:center}
.mt-h span{color:var(--red)}
.mt-sc{overflow-x:auto;padding-top:18px}
.mt-c{position:relative;margin:0 auto}
.mt-c svg{position:absolute;left:0;top:0}
.mt-c path{fill:none;stroke:#c2b4a7;stroke-width:1.3}
.mt-n{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.mt-n.me,.mt-n.unk{cursor:default}
.mt-p{width:56px;height:56px;border-radius:50%;overflow:hidden;background:#eee8e1;display:block;transition:transform .2s}
.mt-p img,.mt-p .noph{width:100%;height:100%;object-fit:cover;object-position:50% 22%;font-size:.85rem}
.mt-n:not(.me):not(.unk):hover .mt-p{transform:scale(1.07)}
.mt-n.me .mt-p{box-shadow:0 0 0 2px var(--cream),0 0 0 3.5px var(--red)}
.mt-n.unk .mt-p{background:transparent;border:1.3px dashed #c9b9ab}
.mt-n.unk i{display:grid;place-items:center;height:100%;font-style:normal;color:#bba99a;font-weight:600}
.mt-g{font-size:.8rem;font-weight:600;line-height:1.2;margin-top:7px}
.mt-n.me .mt-g{color:var(--red)}
.mt-s{font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.mt-r{font-size:.72rem;font-weight:600;color:var(--red);line-height:1.2;margin-top:2px}
.mt-n.unk .mt-r{color:var(--muted);font-weight:500}

/* ===== v11: больше бордового, милая графика ===== */
.top{background:var(--red);border-bottom:0}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-size:1.2rem}
.logo svg{width:30px;height:28px;color:#fff;flex:none}
.top nav a{color:rgba(255,255,255,.72);border-bottom-color:transparent}
.top nav a:hover{color:#fff}
.top nav a[aria-current="page"]{color:#fff;border-bottom-color:#fff}
.cover{position:relative;overflow:hidden;background:var(--red);color:#fff;padding-block:64px 56px}

  fams.forEach(q=>{ if(!q.f.ks.length) return; { const xs0=q.f.ks.map(x=>P[x].x); if(q.f.ks.length>1&&Math.abs((Math.min(...xs0)+Math.max(...xs0))/2-q.sx)<1) return; } const k=q.f.ks.reduce((m,x)=>Math.abs(P[x].x-q.sx)<Math.abs(P[m].x-q.sx)?x:m,q.f.ks[0]), kx=P[k].x;

  const groups=[]; [Lc,R,...extra].filter(Boolean).forEach(c=>c.ks.length&&groups.push({px:[xi,X0[c.sp]],ks:c.ks})); solo.forEach(c=>c.ks.length&&groups.push({px:[xi],ks:c.ks}));
  const mid=g=>g.px.reduce((a,b)=>a+b)/g.px.length; groups.sort((p,q)=>mid(p)-mid(q));
  let edge=-1e9; groups.forEach((g,gi)=>{ const ws=g.ks.map(c=>sw(c,1)), tot=ws.reduce((a,b)=>a+b,0)+G*(g.ks.length-1); let s=Math.max(mid(g)-tot/2,edge+G); const xs=[];
    g.ks.forEach((c,i)=>{ const x=s+ws[i]/2; xs.push(x); down(c,1,x,1); s+=ws[i]+G; }); edge=s-G; fam(g.px,0,xs,1,gi*8); });
  if(nodes.length<2) return '';
  const minX=Math.min(...nodes.map(n=>n.x))-NW/2, maxX=Math.max(...nodes.map(n=>n.x))+NW/2, rows=nodes.map(n=>n.row), r1=Math.min(...rows), r2=Math.max(...rows);
  const SX=v=>v-minX+pad, Y=r=>(r-r1)*RH, MY=r=>Y(r)+28, W=maxX-minX+pad*2, H=(r2-r1)*RH+NH+6;
  let l='',wl='';
  lines.forEach(o=>{ if(o.t==='cp'){ const [p,q]=o.a<o.b?[o.a,o.b]:[o.b,o.a]; l+=`<path d="M${SX(p)+30} ${MY(o.row)}H${SX(q)-30}"/>`; if(o.w) wl+=`<span class="mt-w" style="left:${(SX(p)+SX(q))/2}px;top:${Y(o.row)-2}px">венч. ${o.w}</span>`; return; }
    const pm=o.pxs.length===2?(SX(o.pxs[0])+SX(o.pxs[1]))/2:SX(o.pxs[0]), by=Y(o.crow)-24-o.off, xs=o.cxs.map(SX);
    l+=`<path d="M${pm} ${o.pxs.length===2?MY(o.prow):Y(o.prow)+NH+2}V${by}"/><path d="M${Math.min(pm,...xs)} ${by}H${Math.max(pm,...xs)}"/>`; xs.forEach(x=>l+=`<path d="M${x} ${by}V${Y(o.crow)}"/>`); });
  const node=n=>{const d=D[n.k],unk=!!d[6]; return `<button type="button" class="mt-n ${n.me?'me':''} ${unk?'unk':''}" ${unk||n.me?'':`data-id="${n.k}"`} style="left:${SX(n.x)}px;top:${Y(n.row)}px;width:${NW}px"><span class="mt-p">${unk?'<i>?</i>':img(n.k)}</span><span class="mt-g">${unk?d[1]:d[1].split(' ').slice(0,2).join(' ')}</span>${!unk&&d[0]?`<span class="mt-s">${d[0]}</span>`:''}<span class="mt-r">${unk?'имя неизвестно':(REL[n.k]||(n.k==='galina'?'Галина':''))}</span></button>`;};
  return `<div class="mt"><div class="mt-h">Семья: <span>${D[id][1].split(' ')[0]}${D[id][0]?' '+D[id][0]:''}</span> · все предки и все потомки</div><div class="mt-sc"><div class="mt-c" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}">${l}</svg>${wl}${nodes.map(node).join('')}</div></div></div>`;
}
const dlg=document.getElementById('dlg'), dc=document.getElementById('dc');
function openP(id){ const d=D[id]; if(!d||d[6]) return;
  dc.innerHTML=`<div class="dl"><div class="dph">${img(id)}</div><div class="db">${REL[id]?`<div class="rlb">${REL[id]} Галины</div>`:''}<h3>${name(id)}</h3>${d[2]?`<div class="maid">урождённая ${d[2]}</div>`:''}<div class="dy">${yrs(id)}</div>${d[5]?`<p class="dn">${d[5]}</p>`:''}</div></div>${miniTree(id)}`;
  if(!dlg.open) dlg.showModal(); dlg.scrollTop=0;
  const sc=dc.querySelector('.mt-sc'), c=dc.querySelector('.mt-c'); if(sc&&c){ const W=parseFloat(c.style.width), k=Math.min(1,Math.max(.62,(sc.clientWidth-8)/W)); c.style.zoom=k;
    const me=c.querySelector('.me'); if(me&&W*k>sc.clientWidth) sc.scrollLeft=parseFloat(me.style.left)*k-sc.clientWidth/2; } }
document.addEventListener('click',e=>{ const gt=e.target.closest('[data-goto]'); if(gt){ e.preventDefault(); if(gt.dataset.tabgo){ const tb=document.querySelector(`[data-tab="${gt.dataset.tabgo}"]`); if(tb) tb.click(); } if(cur!=='home'){ location.hash='#home'; } setTimeout(()=>document.getElementById(gt.dataset.goto).scrollIntoView({behavior:'smooth'}),60); return; } const sc=e.target.closest('[data-scroll]'); if(sc){ e.preventDefault(); document.getElementById(sc.dataset.scroll).scrollIntoView({behavior:'smooth'}); return; } if(editing&&e.target.closest('[data-edit]')) return; const b=e.target.closest('[data-id]'); if(b){ e.preventDefault(); openP(b.dataset.id);} });

/* ---------- карты областей ---------- */
const regCharts={};
function drawRegion(k){ const R=REG[k], el=document.getElementById('map-'+k); if(!el||!el.clientWidth) return; if(regCharts[k]){regCharts[k].reflow();return;}
  const MAP=window.Highcharts&&Highcharts.maps&&Highcharts.maps['countries/ru/ru-all'];
  if(window.__noHC||!Highcharts.mapChart||!MAP||!window.proj4){ fallbackMap(el,R.pts,R.bb,R.routes); return; }
  try{ const props=f=>JSON.stringify(f.properties||{}); const md=Object.assign({},MAP,{features:MAP.features.filter(f=>R.re.test(props(f)))});
    regCharts[k]=Highcharts.mapChart(el,{chart:{map:md,events:{render:function(){ const ch=this; if(!R.routes) return; if(ch.__rt) ch.__rt.destroy(); const s=ch.series[1]; if(!s) return; const P={}; s.points.forEach(p=>{ if(p.plotX!=null) P[p.name]=[p.plotX+ch.plotLeft,p.plotY+ch.plotTop]; }); const g=ch.renderer.g('routes').attr({zIndex:4}).add(); ch.__rt=g; const tmp=document.createElementNS('http://www.w3.org/2000/svg','g'); tmp.innerHTML=routeSVG(R.routes,P); [...tmp.children].forEach(n=>g.element.appendChild(n)); }},backgroundColor:'#f7f3ee',style:{fontFamily:'Montserrat, system-ui, sans-serif'},spacing:[10,10,10,10]},title:{text:null},credits:{enabled:false},legend:{enabled:false},
      mapNavigation:{enabled:true,enableMouseWheelZoom:false,buttonOptions:{verticalAlign:'bottom',theme:{fill:'#fff','stroke-width':1,stroke:'#d9cdc3',r:0}}},
      tooltip:{backgroundColor:'#fff',borderColor:'#d9cdc3',shadow:false,useHTML:true,headerFormat:'',pointFormat:'<b>{point.name}</b><br><span style="color:#7d746e">{point.desc}</span>'},
      series:[{type:'map',mapData:md,data:md.features.filter(f=>R.hl.test(props(f))).map(f=>({'hc-key':f.properties['hc-key'],color:'#ecdcd6'})),joinBy:'hc-key',nullColor:'#ffffff',borderColor:'#d9cdc3',borderWidth:1,enableMouseTracking:false},
        {type:'mappoint',data:R.pts.map(([n,a,l,c,d,s])=>pinPt(n,a,l,c,d,s,COL2[c])),dataLabels:{enabled:true,allowOverlap:true,crop:false,overflow:'allow'}}]});
  }catch(e){ console.warn(e); fallbackMap(el,R.pts,R.bb,R.routes); } }
/* ---------- маршруты переселения ---------- */
function routeSVG(routes,P){ return (routes||[]).map(([a,b,l,d,c],i)=>{ const A=P[a],B=P[b]; if(!A||!B) return ''; const dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy)||1, ux=dx/len,uy=dy/len;
  const sx=A[0]+ux*8, sy=A[1]+uy*8, ex=B[0]-ux*12, ey=B[1]-uy*12, bend=(i%2?-1:1)*Math.min(70,len*.28), mx=(sx+ex)/2-uy*bend, my=(sy+ey)/2+ux*bend;
  const tx=ex-mx,ty=ey-my,tl=Math.hypot(tx,ty)||1,vx=tx/tl,vy=ty/tl, h=`M${ex+vx*2} ${ey+vy*2}L${ex-vx*9-vy*5} ${ey-vy*9+vx*5}L${ex-vx*9+vy*5} ${ey-vy*9-vx*5}Z`;
  return `<path d="M${sx} ${sy}Q${mx} ${my} ${ex} ${ey}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" ${d?'stroke-dasharray="5 5"':''} opacity=".9"/><path d="${h}" fill="${c}"/>`; }).join(''); }
/* ---------- вкладки линий на главной ---------- */
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b)); const k=b.dataset.tab;
  document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==k); drawRegion(k); fitGens(); });
/* ---------- страницы ---------- */
let cur='home';
function show(){ let k=(location.hash||'#home').slice(1); if(!document.querySelector(`.page[data-page="${k}"]`)) k='home'; cur=k;
  document.querySelectorAll('.page').forEach(p=>p.hidden=p.dataset.page!==k);
  document.querySelectorAll('.top nav a').forEach(a=>a.toggleAttribute('aria-current',!a.dataset.goto&&a.getAttribute('href')==='#'+k)); document.querySelectorAll('.top nav a[aria-current]').forEach(a=>a.setAttribute('aria-current','page'));
  document.title=(k==='home'?'':TITLE[k]+' — ')+'Семья Максимовых'; scrollTo(0,0); layoutCur(); }
function layoutCur(){ fitGens(); if(cur==='home'&&tLine){ if((tLine.__m||false)!==lineMobile()){ tLine=mkLine(document.getElementById('tv-line')); tLine.__m=lineMobile(); } fitW(tLine,1,lineMobile()?0:.6); }  const s=STAGES[cur]; if(s&&s.fitted) s.fit(); if(lineT[cur]) fitW(lineT[cur],1,.72); document.querySelectorAll('.page.on .tv, .page:not([hidden]) .tv').forEach(eqRows); if(cur==='geo') drawGeo('map-geo'); if(cur==='home'){ homeMap(); const t=document.querySelector('[data-tab][aria-selected="true"]'); if(t) drawRegion(t.dataset.tab); } }
let hmObs=null; function homeMap(){ if(hmObs) return; hmObs=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) drawGeo('map-home'); },{rootMargin:'300px'}); hmObs.observe(document.getElementById('map-home')); }
addEventListener('hashchange',show);
addEventListener('resize',layoutCur);
{ let rw=0,rt=null; try{ new ResizeObserver(es=>{ const w=Math.round(es[0].contentRect.width); if(w===rw) return; rw=w; clearTimeout(rt); rt=setTimeout(layoutCur,60); }).observe(document.getElementById('tv-line')||document.body); }catch(e){} }
let rbT=null; const rebuild=()=>{ clearTimeout(rbT); rbT=setTimeout(()=>{ buildAll(); buildGens(); Object.values(STAGES).forEach(s=>s.fitted=true); layoutCur(); },120); };
if(document.fonts){ document.fonts.ready.then(rebuild); document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',rebuild); }
addEventListener('load',rebuild);

/* ---------- черновик: тексты и фото ---------- */
const OK_TAGS=new Set(['P','A','B','I','EM','STRONG','BR','SPAN','DIV']);
function clean(html){ const t=document.createElement('template'); t.innerHTML=html; (function walk(n){ [...n.childNodes].forEach(c=>{ if(c.nodeType===1){ if(!OK_TAGS.has(c.tagName)){ c.replaceWith(...c.childNodes); walk(n); return; }
  [...c.attributes].forEach(a=>{ const ok=(c.tagName==='A'&&a.name==='href'&&/^(https?:|#)/.test(a.value))||(a.name==='class'&&/^(gap|src)$/.test(a.value))||(c.tagName==='A'&&(a.name==='target'||a.name==='rel')); if(!ok) c.removeAttribute(a.name); }); walk(c); } else if(c.nodeType!==3) c.remove(); }); })(t.content); return t.innerHTML; }
function applySlot(key,url){ const f=document.querySelector(`[data-slot="${key}"]`); if(!f) return; const box=f.querySelector('.img');
  if(url){ box.innerHTML=`<img src="${url}" alt="">`; f.classList.add('has'); } else { box.innerHTML=`${cam}<small>место для фото</small>`; f.classList.remove('has'); } }
function applyState(){ Object.entries(ST.texts||{}).forEach(([k,v])=>{ const el=document.querySelector(`[data-edit="${k}"]`); if(el) el.innerHTML=clean(v); }); Object.entries(ST.photos||{}).forEach(([k,v])=>applySlot(k,v)); }
fetch('content.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&typeof j==='object'){ ST={texts:j.texts||{},photos:j.photos||{}}; applyState(); } }).catch(()=>{});

const edbar=document.getElementById('edbar'), edst=document.getElementById('edst'), edgo=document.getElementById('edgo'), edsave=document.getElementById('edsave'), edcancel=document.getElementById('edcancel'), upf=document.getElementById('upfile');
let ART=null, upKey=null, dirty=false;
const setSt=t=>edst.textContent=t||'';
function setEditing(on){ editing=on; document.body.classList.toggle('editing',on); document.querySelectorAll('[data-edit]').forEach(el=>{ if(on) el.setAttribute('contenteditable','true'); else el.removeAttribute('contenteditable'); });
  edgo.hidden=on; edsave.hidden=!on; edcancel.hidden=!on; setSt(on?'Нажмите на текст, чтобы изменить; фото — кнопкой на рамке':''); }
document.addEventListener('input',e=>{ if(editing&&e.target.closest('[data-edit]')){ dirty=true; setSt('Есть несохранённые изменения'); } });
document.addEventListener('click',e=>{ const u=e.target.closest('[data-up]'), rm=e.target.closest('[data-rm]');
  if(u){ upKey=u.dataset.up; upf.value=''; upf.click(); }
  if(rm){ const k=rm.dataset.rm; if(ST.photos[k]&&!PEND[ST.photos[k]]) DEL.add(ST.photos[k]); if(ST.photos[k]) delete PEND[ST.photos[k]]; delete ST.photos[k]; applySlot(k,null); dirty=true; setSt('Есть несохранённые изменения'); } });
async function shrink(file){ const bmp=await createImageBitmap(file); const m=1600, k=Math.min(1,m/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(r,'image/jpeg',.86)); }
upf.addEventListener('change',async()=>{ const f=upf.files&&upf.files[0]; if(!f||!upKey) return; setSt('Готовлю фото…');
  try{ const blob=await shrink(f); const path=`photos/${upKey}-${Date.now()}.jpg`; const old=ST.photos[upKey]; if(old){ if(PEND[old]) delete PEND[old]; else DEL.add(old); }
    PEND[path]=blob; ST.photos[upKey]=path; applySlot(upKey,URL.createObjectURL(blob)); dirty=true; setSt('Фото добавлено — не забудьте сохранить'); }catch(e){ setSt('Не удалось открыть этот файл'); } });
edgo.onclick=()=>setEditing(true);
edcancel.onclick=()=>{ if(!dirty||confirm('Отменить несохранённые изменения?')) location.reload(); };
edsave.onclick=async()=>{ if(!ART) return; edsave.disabled=true; setSt('Сохраняю…');
  document.querySelectorAll('[data-edit]').forEach(el=>{ const v=clean(el.innerHTML); if(el.dataset.orig!==v) ST.texts[el.dataset.edit]=v; });
  const files={'content.json':JSON.stringify(ST)}; Object.entries(PEND).forEach(([p,b])=>files[p]=b); DEL.forEach(p=>files[p]=null);
  try{ await ART.publish(files); PEND={}; DEL.clear(); dirty=false; document.querySelectorAll('[data-edit]').forEach(el=>el.dataset.orig=clean(el.innerHTML)); setSt('Сохранено'); setEditing(false); }
  catch(e){ const c=e&&e.code; setSt(c==='not_writer'||c==='not_granted'?'У вас нет прав на изменение этой страницы':c==='capability_disabled'?'Сохранение недоступно: страница открыта по публичной ссылке':c==='conflict'?'Страницу только что изменили — она перезагрузится':'Не получилось сохранить, попробуйте ещё раз'); if(c==='not_writer'||c==='not_granted') edbar.hidden=true; }
  edsave.disabled=false; };
addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
document.querySelectorAll('[data-edit]').forEach(el=>el.dataset.orig=clean(el.innerHTML));
(async()=>{ try{ if(!window.claude||!claude.use) return; const [a,u]=await Promise.all([claude.use('artifact'),claude.use('user')]); if(!a) return; ART=a; const can=u?await u.canEdit():true; if(can===false) return; edbar.hidden=false; }catch(e){} })();

(()=>{ const top=document.querySelector('.top'), bt=top&&top.querySelector('.burger'); if(!bt) return;
  const set=v=>{ top.classList.toggle('open',v); bt.setAttribute('aria-expanded',v); };
  bt.addEventListener('click',e=>{ e.stopPropagation(); set(!top.classList.contains('open')); });
